# Phase 2G CI - TypeScript, gate, migration sanity
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # Run on every PR (including stacked PRs whose base is another feature branch).
    branches: ["**"]

jobs:
  check:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Audit storage orgId usage
        run: node scripts/audit-storage-orgid.mjs

      - name: Audit 5xx responses never echo database error text
        run: node scripts/audit-db-error-echo.mjs

      - name: Audit UI wiring (dead links, unparsed mutation results)
        run: node scripts/audit-ui-wiring.mjs

      - name: Audit schema drift (two schema files, same tables)
        run: node scripts/audit-schema-drift.mjs

      - name: Audit migration numbering (no two migrations share a number)
        run: node scripts/audit-migration-numbers.mjs

      - name: Audit customer contact fields (read only through the customer view)
        run: node scripts/audit-contact-fields.mjs

      # --omit=dev deliberately: a CVE in eslint or playwright does not reach a
      # customer, and failing the build on one trains everyone to ignore this
      # step. This gates only what actually ships.
      #
      # Nothing had ever run it. Production carried 4 vulnerabilities, 3 of them
      # high, including a DOMPurify sanitiser bypass — and this app renders
      # operator-editable receipt and invoice HTML through it. The high-severity
      # ones all traced to jest/ts-jest sitting in `dependencies` rather than
      # `devDependencies`, so a test framework was shipping to production.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests
        run: npm test

  e2e:
    name: Playwright smoke (P10d)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midnight_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Apply SQL migrations (raw)
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d midnight_test \
              -v ON_ERROR_STOP=0 -f "$f"
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test
          SESSION_SECRET: ci-e2e-session-secret-32chars-minimum

  a11y:
    name: Playwright a11y (U5)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midnight_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Apply SQL migrations (raw)
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d midnight_test \
              -v ON_ERROR_STOP=0 -f "$f"
          done

      - name: Seed the database
        # Without this the job was vacuous: an empty database renders empty
        # tables, so the per-row action buttons and status badges that carry
        # every one of the violations simply did not exist. It passed here
        # while the same suite found 155 button-name and 70 colour-contrast
        # failures against a database with rows in it.
        run: npm run seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright a11y
        run: npm run test:a11y
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test
          SESSION_SECRET: ci-a11y-session-secret-32chars-minimum

  journeys:
    name: Playwright journeys (money, documents, tenancy, UI seams)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midnight_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Apply SQL migrations (raw)
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d midnight_test \
              -v ON_ERROR_STOP=0 -f "$f"
          done

      - name: Seed the database
        # The journey fixtures impersonate seeded role users (seed-admin,
        # seed-cashier, ...) and resolve the seeded org. Against a schema-only
        # database every journey fails at fixture setup.
        run: npm run seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright journeys
        run: npm run test:journeys
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test
          SESSION_SECRET: ci-journeys-session-secret-32chars-min

  unit-db:
    # Vitest suites that need a real database rather than a mock. The `check`
    # job runs vitest with no DATABASE_URL, and vitest.config.ts excludes every
    # DB-backed suite in that mode, so until this job existed nothing in CI ran
    # a transaction against Postgres outside Playwright.
    #
    # Why an explicit file list and not `npm test` with DATABASE_URL set: that
    # exclude array is conditional on DATABASE_URL being unset, so setting it
    # would silently switch on TWELVE other legacy suites (orderOutboxAtomicity,
    # devAuthBypass, whatsappStore, purchasingPipeline, creditCommission,
    # tradingDayShift, dailyClose and the five integrity* files) that have never
    # run here, against a database seeded for something else. Turning those on
    # is a separate decision with its own triage; this job runs the Operations
    # Centre suites and nothing else (brief finding G25).
    #
    # Since added by name, each run locally against a seeded database first:
    # controlCentreSnapshot (the To collect / board lane agreement),
    # purchasingPipeline.integration (triaged and green — it covers the
    # purchase-draft and over-delivery fixes, so leaving it skipped meant those
    # fixes had no test in CI), purchasingRoutes, uiSeen, and jobClaimRace (a
    # job must run once; a loyalty earn must land once).
    #
    # The files are written by later packages (N3b, N5a, N7). Absent ones are
    # skipped with a log line rather than failing, so this job is green from the
    # day it lands and each package simply starts contributing to it — nobody
    # has to come back and edit this file when a suite appears.
    name: DB integration tests (Operations Centre)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midnight_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Apply SQL migrations (raw)
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d midnight_test \
              -v ON_ERROR_STOP=0 -f "$f"
          done

      - name: Seed the database
        # These suites read and write real orders for a real org. Against a
        # schema-only database they would fail at setup, the same way the a11y
        # and journeys jobs did before they were seeded.
        run: npm run seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Vitest (explicit DB-suite file list)
        run: |
          set -euo pipefail
          present=()
          for f in \
            server/__tests__/orderClaimRace.test.ts \
            server/__tests__/orderTransitionAtomicity.test.ts \
            server/__tests__/opsBoardQuery.test.ts \
            server/__tests__/opsAlertSweep.test.ts \
            server/__tests__/orderTimingReport.test.ts \
            server/__tests__/opsBoardSuperAdminStaff.test.ts \
            server/__tests__/controlCentreSnapshot.test.ts \
            server/__tests__/purchasingPipeline.integration.test.ts \
            server/__tests__/purchasingRoutes.test.ts \
            server/__tests__/uiSeen.test.ts \
            server/__tests__/jobClaimRace.test.ts \
            server/__tests__/roleMatrix.test.ts \
            server/__tests__/customerViews.test.ts \
            server/__tests__/customerExports.test.ts \
            server/__tests__/contactAccess.test.ts \
            server/__tests__/productWrites.test.ts \
            server/__tests__/productMinPrice.test.ts \
            server/__tests__/priceExceptions.test.ts \
            server/__tests__/priceGuardTill.test.ts \
            server/__tests__/needsALook.test.ts \
            server/__tests__/problemReports.test.ts \
            server/__tests__/usageRecord.test.ts \
            server/__tests__/signals.test.ts \
            server/__tests__/whatsappMarketingConsent.test.ts \
            server/__tests__/staffKpiReplaced.test.ts \
            server/__tests__/staffPerformance.test.ts \
            server/__tests__/staffPerformance7c.test.ts \
            server/__tests__/reportScopeFilter.test.ts \
            server/__tests__/cashierAnalyticsRoutes.test.ts \
            server/__tests__/staffPayLockdown.test.ts \
            server/__tests__/creditLockdown.test.ts \
            server/__tests__/overdueInvoiceCount.test.ts \
            server/__tests__/shopPrivacyNotice.test.ts \
            server/__tests__/previewRole.test.ts \
            server/__tests__/tickCustomerRoutes.test.ts \
            server/__tests__/allowedUsersOrgScope.test.ts \
            server/__tests__/saleRecordedOnce.test.ts \
            server/__tests__/salePricing.test.ts \
            server/__tests__/orderEditMoney.test.ts \
            server/__tests__/cashupInvoices.test.ts \
            server/__tests__/stockCentre.test.ts \
            server/__tests__/truthsLayout.test.ts \
            server/__tests__/cardLinks.test.ts \
            server/__tests__/myRun.test.ts \
            server/__tests__/askArcarna.test.ts \
            server/__tests__/reconcileFigures.test.ts
          do
            if [ -f "$f" ]; then
              present+=("$f")
            else
              echo "· $f not present yet (its package has not landed) — skipping"
            fi
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "No Operations Centre DB suites present yet; nothing to run."
            exit 0
          fi
          echo "Running ${#present[@]} DB suite(s):"
          printf '  %s\n' "${present[@]}"
          npx vitest run "${present[@]}"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test
          SESSION_SECRET: ci-unit-db-session-secret-32chars-min

  migration-sanity:
    name: Migration sanity (fresh DB)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midnight_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Apply SQL migrations (raw)
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d midnight_test \
              -v ON_ERROR_STOP=0 -f "$f"
          done

      - name: Migration sanity (post db:push)
        run: npm run migration:sanity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      # Must run last in this job: it invokes `drizzle-kit push` for real, so the
      # database is no longer in the shape the steps above built.
      - name: Audit schema/migration drift (would push destroy anything?)
        run: node scripts/audit-schema-push-drift.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

  gate:
    name: Release gate (Phase 2D)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midnight_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Push schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Apply SQL migrations (raw)
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d midnight_test \
              -v ON_ERROR_STOP=0 -f "$f"
          done

      - name: Release gate
        run: npm run gate 2>&1 | tee gate-output.log
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midnight_test

      - name: Upload gate output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-output
          path: gate-output.log
