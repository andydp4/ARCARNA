<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ARCARNA — Core Flare</title>
<style>
/*
 * ARCARNA — Core Flare
 * ------------------------------------------------------------------
 * Design source for the Control Centre backdrop. A metal sphere holds a
 * Truth Blue sphere inside it. Two doors slide apart horizontally,
 * opening a vertical aperture; the blue shine escapes in a burst, the
 * eye adjusts, and it settles to the blue core pulsing inside the shell.
 *
 * Beats:
 *   0.00-0.50s  the metal sphere sits closed, dark, rim-lit
 *   0.50-1.20s  the doors slide apart; a line of Truth Blue appears
 *   1.20-1.50s  the shine escapes — vertical shaft, anamorphic flare
 *   1.50-2.70s  the eye adjusts; the burst falls away
 *   2.70s+      settled: the blue core pulsing behind a part-open door
 *
 * The doors are clipped by the shell, which is a circle with
 * overflow:hidden. They slide out of frame behind that mask rather than
 * detaching, so the sphere's silhouette stays a whole circle throughout
 * — it is a thing opening, not a thing being pulled apart.
 *
 * Built from CSS rather than a rendered video: the piece ends in an
 * indefinite pulse, which a one-shot video cannot do, and it animates
 * transform and opacity only, so it composites on the GPU and costs
 * effectively nothing once settled.
 */

:root {
  --truth-blue: #3C7AC4;
  --navy:       #0B2E66;
  --deep-blue:  #123B78;
  --sky-blue:   #5DB4FF;
  --light-blue: #B6D9FF;

  --sphere: 260px;
  --open: 16px;      /* how far the right door slides */
  --open-l: calc(var(--open) * 1.5);   /* the left opens half again as far */
  --cap: 6%;         /* fixed shell at each pole; the doors run between */
  --gain: 1;         /* 1 = full; above 1 brightens past it */
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05080f; }

.stage {
  position: relative;
  width: 100%;
  height: 420px;
  overflow: hidden;
  background: radial-gradient(120% 140% at 50% 46%, #0a1526 0%, #05080f 62%, #03050a 100%);
}

.at-centre {
  position: absolute;
  left: 50%;
  top: 46%;
}

/* ── the metal sphere ────────────────────────────────────────────────
 * A circular mask. Everything inside — core and doors alike — is cut to
 * this circle, which is what keeps the silhouette whole while the doors
 * travel.
 */
.shell {
  width: var(--sphere);
  height: var(--sphere);
  margin-left: calc(var(--sphere) / -2);
  margin-top: calc(var(--sphere) / -2);
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #060c16 0%, #02040a 70%);
  box-shadow:
    inset 0 0 60px rgba(2,4,10,0.9),
    0 0 50px rgba(2,4,10,0.85);
}

/* The far inside wall of the shell, seen through the aperture above and
   below the core. Lit only by bounce off the plasma, so it reads as the
   inside of the same object rather than as a hole through it. */
.interior {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse 42% 60% at 50% 44%, #0c1a2c 0%, #071120 44%, #03070f 78%, #02040a 100%);
  box-shadow: inset 0 22px 40px rgba(2,4,10,0.9), inset 0 -22px 40px rgba(2,4,10,0.9);
}

/* The Truth Blue sphere living inside the shell. Read as dense plasma,
   not glass: it is lit from within and you do not see through it. */
.core-sphere {
  position: absolute;
  inset: 0;          /* fills the shell exactly — no dark inside the slot */
  border-radius: 50%;
  background:
    /* Terminator. A 30px-wide slice of a sphere is geometrically almost
       flat, so its roundness has to come from shading — without this the
       slot shows a straight blue bar with square ends. */
    /* Shaded toward Navy rather than black: the poles still have to fall
       away for the slice to read as curved, but the sphere is Truth Blue
       all the way to its edge — no black inside the shell. */
    linear-gradient(180deg,
      rgba(11,46,102,0.88) 0%, rgba(11,46,102,0.52) 10%, rgba(18,59,120,0.16) 22%,
      transparent 36%, transparent 64%,
      rgba(18,59,120,0.22) 78%, rgba(11,46,102,0.60) 91%, rgba(11,46,102,0.90) 100%),
    /* The nucleus, hotter and tighter than the body — plasma, not a
       painted ball. */
    radial-gradient(ellipse 26% 20% at 46% 40%, #ffffff 0%, #dcefff 34%, transparent 72%),
    radial-gradient(circle at 44% 38%,
      #cfe6ff 0%,
      var(--light-blue) 11%,
      var(--sky-blue) 26%,
      var(--truth-blue) 48%,
      #2a5c9c 68%,
      var(--deep-blue) 86%,
      var(--navy) 100%);
  box-shadow: 0 0 50px rgba(93,180,255,0.55), 0 0 120px rgba(60,122,196,0.45);
}

/* The two doors. Metal, brushed along their travel, with a lit lip on
   the edge that faces the aperture. */
/* Both doors span the full shell and are clipped to opposite sides of one
   shared square wave. Sharing a single boundary makes the mesh exact by
   construction — two independently generated profiles have to agree, and
   an earlier pair did not, which left the shut sphere showing daylight. */
.door {
  position: absolute;
  top: var(--cap);
  bottom: var(--cap);
  left: 0;
  right: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 22%, transparent 74%, rgba(0,0,0,0.35) 100%),
    linear-gradient(90deg, #0a1220 0%, #1b2b44 30%, #223350 46%, #142135 62%, #070d18 100%);
}
/* Square teeth along the meeting edge, in complementary phase so the pair
   mesh with no gap when shut. drop-shadow rather than a border for the lit
   edge: it follows the clipped alpha shape, where a border sits on the box
   edge and would survive only on the tooth tips. */
.door-l {
  clip-path: polygon(0% 0%, 52.6% 0%, 52.6% 10%, 47.4% 10%, 47.4% 20%, 52.6% 20%, 52.6% 30%, 47.4% 30%, 47.4% 40%, 52.6% 40%, 52.6% 50%, 47.4% 50%, 47.4% 60%, 52.6% 60%, 52.6% 70%, 47.4% 70%, 47.4% 80%, 52.6% 80%, 52.6% 90%, 47.4% 90%, 47.4% 100%, 0% 100%);
  filter: drop-shadow(2px 0 3px rgba(93,180,255,0.42));
}
.door-r {
  clip-path: polygon(100% 0%, 52.6% 0%, 52.6% 10%, 47.4% 10%, 47.4% 20%, 52.6% 20%, 52.6% 30%, 47.4% 30%, 47.4% 40%, 52.6% 40%, 52.6% 50%, 47.4% 50%, 47.4% 60%, 52.6% 60%, 52.6% 70%, 47.4% 70%, 47.4% 80%, 52.6% 80%, 52.6% 90%, 47.4% 90%, 47.4% 100%, 100% 100%);
  filter: drop-shadow(-2px 0 3px rgba(93,180,255,0.42));
}

/* Fixed shell at the poles. These never move, which is what stops the
   sphere reading as two halves coming apart: the aperture is a slot cut
   in a solid object, bounded top and bottom by shell that stays put. */
.cap {
  position: absolute;
  left: -2%;
  right: -2%;
  height: var(--cap);
  background:
    linear-gradient(90deg, #0c1626 0%, #142034 38%, #0e1a2b 66%, #091120 100%);
}
.cap-t { top: 0;    box-shadow: inset 0 -1px 0 rgba(93,180,255,0.18); }
.cap-b { bottom: 0; box-shadow: inset 0 1px 0 rgba(93,180,255,0.18); }

/* A rim around the shell, above the doors, so the sphere reads as one
   machined object rather than two panels sitting side by side. */
.rim {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%,
    transparent 62%, rgba(60,122,196,0.42) 84%, rgba(93,180,255,0.20) 93%, transparent 99%);
  box-shadow: inset 0 0 40px rgba(2,4,10,0.75);
}

/* ── light escaping the aperture ─────────────────────────────────── */
.light {
  position: absolute; inset: 0;
  /* Opacity alone saturates at 1, so a gain above full would do nothing.
     Below 1 it fades; above 1 the brightness filter carries it further. */
  opacity: min(1, var(--gain));
  filter: brightness(max(1, var(--gain)));
}
.light > * { position: absolute; mix-blend-mode: screen; }

/* The shaft through the slot: tall, narrow, the shape of the opening. */
.shaft {
  width: 260px; height: 460px;
  margin-left: -130px; margin-top: -230px;
  background: radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(255,255,255,0.90) 0%,
    rgba(182,217,255,0.62) 10%,
    rgba(93,180,255,0.34) 26%,
    rgba(60,122,196,0.16) 48%,
    rgba(18,59,120,0.05) 72%,
    transparent 88%);
  transform: scaleX(0.16);
}

/* The long faint flare, running with the aperture rather than across it. */
.streak {
  width: 150px; height: 1200px;
  margin-left: -75px; margin-top: -600px;
  background: radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(255,255,255,0.92) 0%,
    rgba(160,208,255,0.50) 8%,
    rgba(93,180,255,0.26) 22%,
    rgba(60,122,196,0.12) 42%,
    rgba(18,59,120,0.04) 66%,
    transparent 82%);
  transform: scaleX(0.14);
}

.spokes {
  width: 820px; height: 820px;
  margin-left: -410px; margin-top: -410px;
  /* Vertical arms only, plus faint diagonals. The horizontal pair were the
     last thing throwing a level line across the frame. */
  background: conic-gradient(from 0deg,
    transparent 0deg, rgba(182,217,255,0.30) 2deg, transparent 6deg,
    transparent 42deg, rgba(93,180,255,0.07) 45deg, transparent 48deg,
    transparent 132deg, rgba(93,180,255,0.07) 135deg, transparent 138deg,
    transparent 174deg, rgba(182,217,255,0.30) 180deg, transparent 186deg,
    transparent 222deg, rgba(93,180,255,0.07) 225deg, transparent 228deg,
    transparent 312deg, rgba(93,180,255,0.07) 315deg, transparent 318deg,
    transparent 360deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.5) 30%, transparent 62%);
          mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.5) 30%, transparent 62%);
  filter: blur(1px);
}

/* Ambient halo the sphere throws onto the space around it. This is what
   remains once the burst is over — the core glowing through the slot. */
.halo {
  width: 720px; height: 720px;
  margin-left: -360px; margin-top: -360px;
  background: radial-gradient(circle,
    rgba(93,180,255,0.26) 0%,
    rgba(60,122,196,0.16) 22%,
    rgba(18,59,120,0.06) 44%,
    transparent 70%);
}

.bloom {
  left: 0; top: 0; right: 0; bottom: 0; margin: 0;
  background: radial-gradient(ellipse 70% 120% at 50% 46%,
    rgba(182,217,255,0.30) 0%,
    rgba(93,180,255,0.14) 24%,
    rgba(60,122,196,0.05) 48%,
    transparent 74%);
}

/* ── the sequence ────────────────────────────────────────────────── */
@keyframes arc-rise { from { opacity: 0; } to { opacity: 1; } }

/* The doors: still, then a firm slide, then held part-open. */
@keyframes arc-door-l {
  0%, 18%  { transform: translateX(0); }
  52%      { transform: translateX(calc(var(--open-l) * -1.3)); }
  76%,100% { transform: translateX(calc(var(--open-l) * -1)); }
}
@keyframes arc-door-r {
  0%, 18%  { transform: translateX(0); }
  58%,100% { transform: translateX(var(--open)); }
}

@keyframes arc-shaft {
  0%, 16%  { opacity: 0;    transform: scaleX(0.05) scaleY(0.30); }
  34%      { opacity: 0.42; transform: scaleX(0.14) scaleY(0.70); }
  44%      { opacity: 1;    transform: scaleX(0.30) scaleY(1.00); }
  60%      { opacity: 0.52; transform: scaleX(0.20) scaleY(0.80); }
  100%     { opacity: 0.30; transform: scaleX(0.16) scaleY(0.62); }
}
@keyframes arc-streak {
  0%, 22%  { opacity: 0;    transform: scaleX(0.14) scaleY(0.05); }
  44%      { opacity: 1;    transform: scaleX(0.18) scaleY(1.00); }
  60%      { opacity: 0.55; transform: scaleX(0.14) scaleY(0.80); }
  100%     { opacity: 0.14; transform: scaleX(0.10) scaleY(0.42); }
}
@keyframes arc-spokes {
  0%, 34%  { opacity: 0;    transform: scale(0.45) rotate(0deg); }
  44%      { opacity: 0.70; transform: scale(1.00) rotate(3deg); }
  62%      { opacity: 0.14; transform: scale(1.14) rotate(6deg); }
  100%     { opacity: 0;    transform: scale(1.18) rotate(8deg); }
}
@keyframes arc-bloom {
  0%, 34%  { opacity: 0; }
  44%      { opacity: 1; }
  58%      { opacity: 0.18; }
  100%     { opacity: 0; }
}
@keyframes arc-halo {
  0%, 20%  { opacity: 0.10; transform: scale(0.80); }
  44%      { opacity: 1.00; transform: scale(1.10); }
  100%     { opacity: 0.55; transform: scale(1.00); }
}

/* Settled: the core breathing behind the open door. */
@keyframes arc-pulse { 0%,100% { opacity: 0.50; } 50% { opacity: 0.95; } }
@keyframes arc-core-pulse {
  0%,100% { opacity: 0.80; filter: brightness(0.86); }
  50%     { opacity: 1;    filter: brightness(1.14); }
}

.shell       { animation: arc-rise 700ms ease-out both; }
.door-l      { animation: arc-door-l 2700ms cubic-bezier(.19,1,.22,1) both; }
.door-r      { animation: arc-door-r 2700ms cubic-bezier(.19,1,.22,1) both; }
.core-sphere { animation: arc-core-pulse 5200ms ease-in-out 2700ms infinite; }
.shaft  { animation: arc-shaft  2700ms cubic-bezier(.19,1,.22,1) both, arc-pulse 5200ms ease-in-out 2700ms infinite; }
.streak { animation: arc-streak 2700ms cubic-bezier(.19,1,.22,1) both, arc-pulse 5200ms ease-in-out 2700ms infinite; }
.halo   { animation: arc-halo   2700ms cubic-bezier(.19,1,.22,1) both, arc-pulse 5200ms ease-in-out 2700ms infinite; }
.spokes { animation: arc-spokes 2700ms cubic-bezier(.19,1,.22,1) both; }
.bloom  { animation: arc-bloom  2700ms cubic-bezier(.19,1,.22,1) both; }

.fade {
  position: absolute; inset-inline: 0; bottom: 0; height: 160px;
  background: linear-gradient(to bottom, transparent, #05080f);
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="light"><div class="halo at-centre"></div></div>

  <div class="shell at-centre">
    <div class="interior"></div>
    <div class="core-sphere"></div>
    <div class="door door-l"></div>
    <div class="door door-r"></div>
    <div class="cap cap-t"></div>
    <div class="cap cap-b"></div>
    <div class="rim"></div>
  </div>

  <div class="light">
    <div class="spokes at-centre"></div>
    <div class="streak at-centre"></div>
    <div class="shaft at-centre"></div>
    <div class="bloom"></div>
  </div>

  <div class="fade"></div>
</div>

<script>
window.ARCARNA_FLARE = {
  seek(ms) {
    document.querySelectorAll('*').forEach((el) => {
      const names = getComputedStyle(el).animationName;
      if (!names || names === 'none') return;
      el.style.animationPlayState = 'paused';
      el.style.animationDelay = names.split(',')
        .map((n) => (n.trim().endsWith('pulse') ? `${-(ms - 2700)}ms` : `${-ms}ms`))
        .join(', ');
    });
  },
};
</script>
</body>
</html>
