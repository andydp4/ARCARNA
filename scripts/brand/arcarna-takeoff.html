<title>Arcarna Takeoff</title>
<style>
/* ===================================================================
   ARCARNA — the takeoff cut.

   A full-frame liquid rather than the disc the other cuts use, and one
   continuous move rather than a loop:

     the lockup rises out of a full-screen liquid
     the liquid drains away, leaving the words still made of liquid
     the words resolve to solid Truth Blue and hold
     the leading a catches a specular wink
     the rest of the wordmark leaves; the a grows and spins to centre
     it winks again, shifts to Light Blue
     and flies at the viewer, streaking out through the frame

   Kept separate from arcarna-liquid.html on purpose. That page's five
   cuts are shipping and share one disc-shaped shader; this needs a
   full-frame field, two mask textures with independent transforms, and
   a radial-blur pass. Folding it in would have put all of that in the
   path of cuts that are already signed off.

   LOW-RES TEST. Timings and moves are first-pass, for direction only.
   =================================================================== */
:root {
  --deep-shadow: #061327;
  --truth-blue:  #3C7AC4;
  --light-blue:  #B6D9FF;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--deep-shadow); overflow: hidden;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#stage { position: fixed; inset: 0; }
#gl { display: block; width: 100%; height: 100%; }

/* Rail hidden in bare mode — what the renderer loads. */
.rail {
  position: fixed; left: 0; right: 0; top: 0; z-index: 10;
  display: flex; gap: 14px; align-items: center; padding: 10px 16px;
  background: rgba(6,19,39,0.55); backdrop-filter: blur(18px);
  color: #B6D9FF; font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.rail button {
  font: 500 12px/1 -apple-system, sans-serif; letter-spacing: 0; text-transform: none;
  color: #B6D9FF; background: rgba(60,122,196,0.24);
  border: 1px solid rgba(93,180,255,0.34); padding: 6px 13px; border-radius: 7px; cursor: pointer;
}
.rail input { flex: 1; accent-color: #3C7AC4; }
body[data-bare="true"] .rail { display: none; }
</style>

<div id="stage"><canvas id="gl"></canvas></div>
<div class="rail">
  <span>Arcarna &middot; takeoff</span>
  <button type="button" id="replay">Replay</button>
  <input type="range" id="scrub" min="0" max="20000" value="0" step="10">
  <span id="tlabel">0.0s</span>
</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  u_res;
uniform float u_phase;      /* liquid's own periodic clock            */
uniform float u_bg;         /* 1 = full field · 0 = drained away      */
uniform float u_wordIn;     /* the lockup rising out of the liquid    */
uniform float u_solid;      /* liquid texture -> flat Truth Blue      */
uniform float u_wordOut;    /* the rest of the wordmark leaving       */
uniform float u_tagIn;      /* the tagline, held back until the field
                               has gone — its strokes are too fine to
                               survive a lift over live liquid        */
uniform float u_wink1;      /* sweep across the leading a, -1..2      */
uniform float u_wink2;      /* sweep across the standalone mark       */
uniform float u_markMix;    /* 0 = a lives in the lockup · 1 = solo   */
uniform float u_markScale;  /* mark size in frame units               */
uniform float u_markRot;
uniform vec2  u_markPos;
uniform float u_light;      /* Truth Blue -> Light Blue               */
uniform float u_streak;     /* radial blur amount on takeoff          */
uniform float u_markFade;
uniform sampler2D u_word;
uniform sampler2D u_mark;
/* reveal / your / truth, packed as three equal cells in one atlas so
   the repulsion gradient costs five samples rather than fifteen. */
uniform sampler2D u_words;
uniform float u_cell;       /* which word: 0, 1, 2                     */
uniform float u_hole;       /* how present that word is — it breathes  */
uniform float u_repel;      /* how hard the liquid is pushed off it    */

const float WM_ASPECT = 3.326;   /* the lockup master, cropped to ink  */
/* Measured off the master rather than eyeballed: the column gap after
   the mark, and the row gap between the wordmark and the tagline taken
   in the right-hand 55% (the a's tail descends past it on the left). */
const float A_END     = 0.357;
const float TAG_Y     = 0.255;   /* wq.y below this, and             */
const float TAG_X     = 0.550;   /* wq.x beyond this, is the tagline */

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i),               hash(i+vec2(1.0,0.0)), u.x),
             mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * vnoise(p); p *= 2.02; a *= 0.5; }
  return v;
}
vec3 ramp(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3( 16.0, 52.0,112.0)/255.0;
  vec3 c1 = vec3( 30.0, 84.0,158.0)/255.0;
  vec3 c2 = vec3( 52.0,116.0,192.0)/255.0;
  vec3 c3 = vec3( 78.0,150.0,222.0)/255.0;
  vec3 c4 = vec3(110.0,190.0,255.0)/255.0;
  vec3 c5 = vec3(148.0,204.0,255.0)/255.0;
  vec3 c6 = vec3(198.0,228.0,255.0)/255.0;
  float s = t * 6.0, i = floor(s), f = s - i;
  vec3 a = c0, b = c1;
  if      (i > 4.5) { a = c5; b = c6; }
  else if (i > 3.5) { a = c4; b = c5; }
  else if (i > 2.5) { a = c3; b = c4; }
  else if (i > 1.5) { a = c2; b = c3; }
  else if (i > 0.5) { a = c1; b = c2; }
  return mix(a, b, f);
}
float boxed(vec2 q){
  /* CLAMP_TO_EDGE would smear the edge pixels across the whole frame,
     so anything outside the glyph's own box reads as empty instead. */
  vec2 s = step(vec2(0.0), q) * step(q, vec2(1.0));
  return s.x * s.y;
}
float wordA(vec2 q){ return texture2D(u_word, vec2(q.x, 1.0 - q.y)).a * boxed(q); }
float markA(vec2 q){ return texture2D(u_mark, vec2(q.x, 1.0 - q.y)).a * boxed(q); }
/* One cell of the atlas, in that cell's own 0..1 box space. */
float phraseA(vec2 q){
  vec2 a = vec2((q.x + u_cell) / 3.0, 1.0 - q.y);
  return texture2D(u_words, a).a * boxed(q);
}

void main(){
  vec2  uv     = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;
  /* Frame space: y in [-0.5,0.5], x widened by aspect, so nothing in
     the layout stretches when the output changes shape. */
  vec2  fp = vec2((uv.x - 0.5) * aspect, uv.y - 0.5);

  /* ---- the words the liquid is repelled by ----------------------- */
  /* The phrase is not drawn on the liquid — it is a hole in it, and the
     field is pushed off its edges so it behaves like oil parting round
     something rather than a logo laid on top. Both the hole and the
     push ride u_hole, so when a word breathes out the liquid simply
     flows back over it. */
  const float PH_W = 0.78, PH_ASPECT = 2.421;
  vec2  pq  = fp / vec2(PH_W, PH_W / PH_ASPECT) + 0.5;
  float ph  = phraseA(pq);
  float e   = 0.007;
  vec2  pgrad = vec2(phraseA(pq + vec2(e, 0.0)) - phraseA(pq - vec2(e, 0.0)),
                     phraseA(pq + vec2(0.0, e)) - phraseA(pq - vec2(0.0, e)));
  float rim = min(length(pgrad) * 2.4, 1.0);

  /* ---- the liquid, full frame ------------------------------------ */
  vec2 p = vec2(uv.x * aspect, uv.y) * 2.0;
  p -= pgrad * u_repel;
  float a = 6.2831853 * u_phase;
  vec2 w1 = vec2(cos( a       ), sin( a       )) * 0.34;
  vec2 w2 = vec2(cos(-a + 2.10), sin(-a + 2.10)) * 0.30;
  vec2 q = vec2(fbm(p), fbm(p + vec2(5.2, 1.3)));
  vec2 r = vec2(fbm(p + 5.5*q + vec2(1.7, 9.2) + w1),
                fbm(p + 5.5*q + vec2(8.3, 2.8) + w2));
  float v = (fbm(p + 5.5*r) - 0.29) / 0.30;
  v = pow(clamp(v, 0.0, 1.0), 0.82);
  v = mix(v, smoothstep(0.16, 0.84, v), 0.65);
  float rl  = min(length(r - 0.5) * 2.2, 1.0);
  vec3  liq = ramp(v * 0.62 + rl * 0.26);
  float lum = dot(liq, vec3(0.2126, 0.7152, 0.0722));
  liq = lum + (liq - lum) * 1.26;
  /* A meniscus where the field is being held off — the bright lip is
     what makes it read as surface tension rather than a cut-out. */
  liq += rim * u_hole * 0.34;

  /* ---- the lockup, in three zones -------------------------------- */
  const float WM_W = 0.86;
  vec2  wq  = fp / vec2(WM_W, WM_W / WM_ASPECT) + 0.5;
  float ink = wordA(wq);

  float lead = ink * step(wq.x, A_END);                          /* the a      */
  float tagl = ink * step(wq.y, TAG_Y) * step(TAG_X, wq.x);      /* the tagline */
  float rest = max(ink - lead - tagl, 0.0);                      /* rcarna      */

  /* arcarna arrives on the liquid; the tagline waits for the field to
     clear. At a lift the bold glyphs survive, the tagline's hairlines
     do not — the first pass lost them entirely against live liquid.
     Everything but the a leaves together, so the a is what is left
     standing rather than something that fades back in. */
  float word = lead * u_wordIn
             + rest * u_wordIn * (1.0 - u_wordOut)
             + tagl * u_tagIn  * (1.0 - u_wordOut);

  /* ---- the standalone mark, free to move ------------------------- */
  float c = cos(u_markRot), s = sin(u_markRot);
  vec2  mq = fp - u_markPos;
  mq = mat2(c, -s, s, c) * mq;
  mq = mq / u_markScale + 0.5;

  float mark = markA(mq);
  /* Radial streaks on the way out: samples pulled back along the line
     to centre, so the smear runs the way the mark is travelling. */
  if (u_streak > 0.001) {
    float acc = 0.0;
    for (int i = 0; i < 10; i++) {
      float t = float(i) / 9.0;
      vec2 sq = (mq - 0.5) / (1.0 + u_streak * t) + 0.5;
      acc += markA(sq);
    }
    mark = max(mark, acc / 10.0);
  }
  mark *= u_markFade;

  /* ---- composite -------------------------------------------------- */
  float glyph = max(word * (1.0 - u_markMix), mark);

  vec3 solidCol = mix(vec3(60.0,122.0,196.0)/255.0, vec3(182.0,217.0,255.0)/255.0, u_light);
  /* The glyph starts as the same liquid, lifted so it reads against a
     field that is still whole, then resolves to flat brand colour. */
  vec3 glyphCol = mix(liq * 1.85 + vec3(0.120, 0.145, 0.175), solidCol, u_solid);

  /* Winks: a narrow diagonal band crossing the glyph. */
  float band1 = exp(-pow((wq.x - wq.y * 0.30 - u_wink1) / 0.055, 2.0))
              * step(wq.x, A_END) * step(0.0, u_wink1);
  /* Gated on u_wordIn so the mask's zones cannot flash before the
     lockup has arrived. */
  float band2 = exp(-pow(((mq.x - mq.y * 0.30) - u_wink2) / 0.10, 2.0))
              * step(0.0, u_wink2);
  float wink = band1 * word + band2 * mark;
  glyphCol += wink * 0.85;

  /* Background drains uniformly — this cut is about the words, not the
     field, so the noise-threshold drain the other cuts use would pull
     focus at exactly the wrong moment. */
  /* Deep Shadow, not black — every other cut sits on it, and a true
     black ground made this one look like a different system. */
  vec3 ground = vec3(6.0, 19.0, 39.0) / 255.0;

  /* The field does not fade out, it runs inward: pixels furthest from
     the lockup empty first, so the water reads as draining INTO the
     word rather than the lights going down on it. */
  float nd   = clamp(length(fp * vec2(0.62, 1.0)) / 0.70, 0.0, 1.0);
  float T    = mix(1.45, -0.30, u_bg < 1.0 ? 1.0 - u_bg : 0.0);
  float keep = 1.0 - smoothstep(T, T + 0.30, nd);

  vec3  col   = mix(ground, liq, keep);
  float alpha = keep;

  /* The phrase is the ground showing through the field. */
  col = mix(col, ground, ph * u_hole * keep);

  float g = glyph;
  col   = mix(col, glyphCol, g);
  alpha = max(alpha, g);

  gl_FragColor = vec4(col, alpha);
}
</script>

  function markCanvas() {
    var c = document.createElement('canvas');
    c.width = c.height = MASK;
    var x = c.getContext('2d');
    var s = MASK * 0.78 / Math.max(MARK_VIEWBOX[0], MARK_VIEWBOX[1]);
    x.translate((MASK - MARK_VIEWBOX[0]*s) / 2, (MASK - MARK_VIEWBOX[1]*s) / 2);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  function texture(unit, source) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    return t;
  }
  texture(1, markCanvas());
  gl.uniform1i(gl.getUniformLocation(prog, 'u_mark'), 1);

  var U = {};
  ['u_res','u_phase','u_bg','u_wordIn','u_solid','u_wordOut','u_tagIn','u_wink1',
   'u_wink2','u_markMix','u_markScale','u_markRot','u_markPos','u_light','u_streak','u_markFade',
   'u_cell','u_hole','u_repel']
    .forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

  /* ================= the timeline =================
     One pass, no loop. Windows are in ms and first-pass by design —
     this is a direction test, not a locked edit. */
  /* Each word is a hole in the liquid that breathes open and closed.
     They overlap slightly at the seams so the field never fully settles
     between them — the phrase reads as one thought, not three cards. */
  var PHRASES = [
    { cell: 0, in: [ 1200,  2600], out: [ 4000,  5100] },   /* reveal */
    { cell: 1, in: [ 4900,  6100], out: [ 7500,  8600] },   /* your   */
    { cell: 2, in: [ 8400,  9600], out: [11000, 12200] }    /* truth  */
  ];

  var T = {
    wordIn:   [12000, 15200],   /* arcarna hardens over the water      */
    drain:    [15400, 18800],   /* the water runs inward, into it      */
    solid:    [18400, 19800],   /* liquid texture -> flat Truth Blue   */
    tagIn:    [19800, 20800],   /* reveal your truth, under the lockup */
    hold:     [20800, 22200],
    wink1:    [22200, 23600],   /* the leading a catches the light     */
    wordOut:  [23800, 25000],   /* everything but the a leaves         */
    spin:     [25000, 27400],   /* four turns, each faster, dead stop  */
    wink2:    [27700, 28200],   /* half a second of glisten            */
    light:    [28200, 28900],   /* -> Light Blue, on the way out       */
    takeoff:  [28200, 30000]
  };
  var LENGTH = 30600;
  var PERIOD = 12000, OFFSET = 42000;

  var clamp01 = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var span = function (t, w) { return clamp01((t - w[0]) / (w[1] - w[0])); };
  var easeInOut = function (x) { return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
  var easeOut = function (x) { return 1 - Math.pow(1 - x, 3); };
  var easeIn = function (x) { return x*x*x; };

  /* Where the leading a sits inside the lockup, in frame units. The
     mark has to start exactly there or the hand-off jumps. */
  var WM_W = 0.86, WM_ASPECT = 3.326, A_END = 0.357;
  var A_CX = (A_END * 0.5 - 0.5) * WM_W;          /* centre of the a    */
  var A_SIZE = WM_W / WM_ASPECT * 1.30;

  var TAU = 6.2831853;

  /* Which word is showing, and how much of it. Breathing is a slow
     sine on top of the envelope — it never reaches full opacity, so the
     liquid is always moving somewhere across the letterforms. */
  function phraseAt(t) {
    for (var i = 0; i < PHRASES.length; i++) {
      var ph = PHRASES[i];
      if (t < ph.in[0] || t > ph.out[1]) continue;
      var env = easeInOut(span(t, ph.in)) * (1 - easeInOut(span(t, ph.out)));
      var breath = 0.84 + 0.16 * Math.sin((t - ph.in[0]) / 1000 * 1.9);
      return { cell: ph.cell, amt: env * breath };
    }
    return { cell: 0, amt: 0 };
  }

  function apply(t) {
    var markMix = span(t, [T.wordOut[1] - 200, T.wordOut[1]]);
    var ph = phraseAt(t);
    gl.uniform1f(U.u_cell, ph.cell);
    gl.uniform1f(U.u_hole, ph.amt);
    /* The push relaxes with the word, so the field washes back over the
       letters as they go rather than the hole simply closing. */
    gl.uniform1f(U.u_repel, ph.amt * 0.55);

    /* Four turns, each faster than the last, stopping dead.
       Angle goes as t^3, so angular speed rises through the whole move
       and is at its maximum when it stops — which is what makes the
       stop read as a stop rather than a drift to rest. A linear or
       ease-out spin gives the opposite feel. */
    var sp    = span(t, T.spin);
    var turns = Math.pow(sp, 3.0);
    var rot   = -4.0 * TAU * turns;

    /* A few degrees of recoil after the stop. Without it, cutting from
       maximum angular speed to zero reads as a dropped frame. */
    if (t > T.spin[1]) {
      var k = clamp01((t - T.spin[1]) / 340);
      rot += 0.13 * Math.sin(k * Math.PI) * (1 - k);
    }

    /* Travel and growth follow the same curve as the spin, so the a
       arrives at centre on the beat the rotation stops. */
    var journey = easeInOut(sp);
    var takeoff = easeIn(span(t, T.takeoff));

    var scale = A_SIZE * (1 + 1.45 * journey) * (1 + 15.0 * takeoff);
    var px = A_CX * (1 - journey);
    var py = 0.0;

    /* Chosen: it leaves on the axis, so the mark stays centred and
       legible right up to the point it goes. The off-axis pass that was
       tried against this read as more physical but slid the mark off
       centre while it was still the thing being read. */

    var wink1 = t >= T.wink1[0] && t <= T.wink1[1]
      ? -0.15 + 1.35 * span(t, T.wink1) : -1;
    var wink2 = t >= T.wink2[0] && t <= T.wink2[1]
      ? -0.35 + 1.85 * span(t, T.wink2) : -1;

    gl.uniform1f(U.u_bg, 1 - easeInOut(span(t, T.drain)));
    gl.uniform1f(U.u_markFade, 1 - easeIn(clamp01((t - 29300) / 900)));
    gl.uniform1f(U.u_wordIn, easeInOut(span(t, T.wordIn)));
    gl.uniform1f(U.u_solid, easeInOut(span(t, T.solid)));
    gl.uniform1f(U.u_wordOut, easeInOut(span(t, T.wordOut)));
    gl.uniform1f(U.u_tagIn, easeInOut(span(t, T.tagIn)));
    gl.uniform1f(U.u_markMix, markMix);
    gl.uniform1f(U.u_markScale, scale);
    gl.uniform1f(U.u_markRot, rot);
    gl.uniform2f(U.u_markPos, px, py);
    gl.uniform1f(U.u_light, easeInOut(span(t, T.light)));
    /* The heavier streak from the off-axis version, kept. On the axis
       it is the only thing selling speed, so it has to do more work. */
    gl.uniform1f(U.u_streak, takeoff * 1.60);
    gl.uniform1f(U.u_wink1, wink1);
    gl.uniform1f(U.u_wink2, wink2);
  }

  function size() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(cv.clientWidth * dpr));
    var h = Math.max(1, Math.round(cv.clientHeight * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
  }

  var started = 0, paused = false, at = 0, ready = false;
  function draw(now) {
    size();
    var t = paused ? at : (now - started);
    if (t > LENGTH) t = LENGTH;
    gl.uniform2f(U.u_res, cv.width, cv.height);
    gl.uniform1f(U.u_phase, (((paused ? at : now - started) + OFFSET) % PERIOD) / PERIOD);
    apply(t);
    if (ready) gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!paused) {
      document.getElementById('scrub').value = t;
      document.getElementById('tlabel').textContent = (t / 1000).toFixed(1) + 's';
    }
    requestAnimationFrame(draw);
  }

  /* Everything the shader samples has to be up before the first draw,
     or a seek lands on a frame with half the artwork missing — the
     renderer steps frames, it does not wait for images. */
  var pending = 1 + PHRASE.length, phraseImgs = [];
  function arrived() {
    if (--pending > 0) return;
    var CW = 0, CH = 0;
    phraseImgs.forEach(function (im) { CW = Math.max(CW, im.width); CH = Math.max(CH, im.height); });
    var atlas = document.createElement('canvas');
    atlas.width = CW * 3; atlas.height = CH;
    var ax = atlas.getContext('2d');
    /* Equal cells, each word centred in its own, so all three occupy the
       same box on screen and the type does not resize word to word. */
    phraseImgs.forEach(function (im, i) {
      ax.drawImage(im, i * CW + (CW - im.width) / 2, (CH - im.height) / 2);
    });
    texture(2, atlas);
    gl.uniform1i(gl.getUniformLocation(prog, 'u_words'), 2);
    ready = true;
  }

  var img = new Image();
  img.onload = function () {
    texture(0, img);
    gl.uniform1i(gl.getUniformLocation(prog, 'u_word'), 0);
    arrived();
  };
  img.src = WORDMARK;

  PHRASE.forEach(function (src, i) {
    var im = new Image();
    im.onload = function () { phraseImgs[i] = im; arrived(); };
    im.src = src;
    phraseImgs[i] = im;
  });

  requestAnimationFrame(function (now) { started = now; draw(now); });

  window.ARCARNA_TAKEOFF = {
    length: LENGTH,
    ready: function () { return ready; },
    seek: function (ms) { paused = true; at = ms; },
    play: function () { paused = false; started = performance.now() - at; },
    bare: function (on) { document.body.dataset.bare = on ? 'true' : 'false'; }
  };

  document.getElementById('replay').addEventListener('click', function () {
    paused = false; started = performance.now(); at = 0;
  });
  document.getElementById('scrub').addEventListener('input', function (e) {
    paused = true; at = +e.target.value;
    document.getElementById('tlabel').textContent = (at / 1000).toFixed(1) + 's';
  });
  if (new URLSearchParams(location.search).get('bare') === '1') document.body.dataset.bare = 'true';
}());
</script>
